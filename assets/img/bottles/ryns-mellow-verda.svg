<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 660" role="img" aria-label="Ryn's Mellow Verda bottle">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F9142" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#4F9142"/>
      <stop offset=".62" stop-color="#4F9142"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a332e"/>
      <stop offset=".22" stop-color="#1d1a17"/>
      <stop offset=".75" stop-color="#141210"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset=".6" stop-color="#f2e9da"/>
      <stop offset="1" stop-color="#ddd0bb"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M100 120v45c0 25-60 50-60 103v332c0 22 18 40 40 40h100c22 0 40-18 40-40V268c0-53-60-78-60-103v-45Z"/>
    </clipPath>
  </defs>

  <!-- glass -->
  <path d="M100 120v45c0 25-60 50-60 103v332c0 22 18 40 40 40h100c22 0 40-18 40-40V268c0-53-60-78-60-103v-45Z"
        fill="url(#glass)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="52" y="120" width="18" height="520" fill="#fff" opacity=".22" rx="9"/>
    <rect x="196" y="120" width="10" height="520" fill="#000" opacity=".28" rx="5"/>
  </g>
  <path d="M100 120v45c0 25-60 50-60 103v332c0 22 18 40 40 40h100c22 0 40-18 40-40V268c0-53-60-78-60-103v-45Z"
        fill="none" stroke="#000" stroke-opacity=".35" stroke-width="2"/>

  <!-- cap -->
  <rect x="93" y="16" width="74" height="108" rx="7" fill="url(#cap)"/>
  <g fill="#000" opacity=".35">
    <rect x="93" y="34" width="74" height="3"/><rect x="93" y="46" width="74" height="3"/>
    <rect x="93" y="58" width="74" height="3"/><rect x="93" y="70" width="74" height="3"/>
    <rect x="93" y="82" width="74" height="3"/><rect x="93" y="94" width="74" height="3"/>
  </g>
  <rect x="93" y="16" width="12" height="108" rx="6" fill="#fff" opacity=".12"/>

  <!-- label -->
  <rect x="46" y="318" width="168" height="238" rx="5" fill="url(#paper)"/>
  <rect x="46" y="318" width="168" height="46" rx="5" fill="#4F9142"/>
  <rect x="46" y="352" width="168" height="12" fill="#4F9142"/>
  <text x="130" y="349" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="15" font-weight="700" letter-spacing="4" fill="#fff" opacity=".92">NO. 1</text>

  <text x="130" y="418" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="18" font-weight="700" fill="#1b1816">RYN'S</text>
  <text x="130" y="441" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="18" font-weight="700" fill="#1b1816">MELLOW VERDA</text>

  <line x1="76" y1="452" x2="184" y2="452"
        stroke="#1b1816" stroke-opacity=".28" stroke-width="1.5"/>
  <text x="130" y="478" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="12" letter-spacing="2.4" fill="#5c5348">JALAPEÑO</text>

  <!-- heat pips -->
  <rect x="62" y="498" width="8" height="16" rx="2" fill="#4F9142"/>
  <rect x="76" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="90" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="104" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="118" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="132" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="146" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="160" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="174" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>
  <rect x="188" y="498" width="8" height="16" rx="2" fill="#c9bcaa"/>

  <text x="130" y="538" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="11" letter-spacing="2" fill="#7d7267">KNOXVILLE · TENNESSEE · 5 FL OZ</text>
</svg>
